<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/icofont/1.0.1/css/icofont.min.css">
</head>
<body>
    <section class="pt-12 bg-[#FFFEF9]">
        <div class="container mx-auto w-[370px] h-[215px] border-2 rounded-lg p-6">
            <div>
                <h2 class="text-2xl font-semibold">Cancel Order</h2>
            </div>
            <div class="mt-6">
                <p class="text-sm text-[#6A6A6A] tracking-wide">You are about to cancel order
                    <span class="font-semibold text-[#363636]">Morning Lunch </span>
                    <span>(#Order-1234)</span>.</p>
            </div>
            <!-- Buttons -->
            <div class="mt-6 grid grid-cols-2 gap-4">
                <button class="border border-[#363636] py-2 w-full text-center rounded">
                    <p class="text-md font-semibold">Close</p>
                </button>
                <button class="bg-[#363636] py-2 w-full text-center rounded">
                    <p class="text-white font-medium">Cancel Order</p>
                </button>
            </div>
        </div>
    </section>
</body>
</html>
