<script>
const email = document.getElementById("email");
const emailError = document.getElementById("emailError");
const btn = document.getElementById("continueBtn");

btn.addEventListener("click", function (e) {
    e.preventDefault();

    const value = email.value.trim();

    email.classList.remove("border-[#D00416]");
    emailError.classList.add("hidden");

    // Empty check
    if (value === "") {
        emailError.textContent = "Please enter your email";
        emailError.classList.remove("hidden");
        email.classList.add("border-[#D00416]");
        return;
    }

    // Allow only proper domains
    const allowedDomains = [
        "gmail.com",
        "yahoo.com",
        "outlook.com",
        "hotmail.com",
        "icloud.com"
    ];

    // Email must match standard pattern
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(value)) {
        emailError.textContent = "Enter a valid email address";
        emailError.classList.remove("hidden");
        email.classList.add("border-[#D00416]");
        return;
    }

    // Check email domain
    const domain = value.split("@")[1];
    if (!allowedDomains.includes(domain)) {
        emailError.textContent = "Enter a valid email domain (e.g. @gmail.com)";
        emailError.classList.remove("hidden");
        email.classList.add("border-[#D00416]");
        return;
    }

    // Passed validation
    console.log("Valid email:", value);
});
</script>
