<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/icofont/1.0.1/css/icofont.min.css">
</head>
<body>
    <!-- NAV BAR -->
    <nav class="bg-[#FFFEF9] sticky top-0 z-40 h-[70px] md:h-[96px] border-b border-[#36363633] py-2 md:py-0">
        <div class="container mx-auto">
            <div class="flex justify-between items-center px-6 md:px-0">
                <img src="images/Office Khaja Logo Red.svg" alt="officekhaja logo" class="h-[52px] md:h-[90px] md:w-[90px] w-auto object-contain">

                <!-- Desktop Links -->
                <div class="flex justify-center">
                    <ul class="hidden md:flex text-[#363636] text-md tracking-wide font-semibold gap-6 ml-14">
                        <li><a href="./menu.html" class="hover:border-b-4 border-[#d9253c] py-9">Menu</a></li>
                        <li><a href="./my-meals.html" class="hover:border-b-4 border-[#d9253c] py-9">My Meals</a></li>
                        <li><a href="./create-custom-meal.html" class="hover:border-b-4 border-[#d9253c] py-9">Create Meal</a></li>
                        <li><a href="./orders-listing.html" class="hover:border-b-4 border-[#d9253c] py-9">My Orders</a></li>
                        <li><a href="#" class="hover:border-b-4 border-[#d9253c] py-9">My Cart</a></li>
                    </ul>
                </div>

                <!-- Profile Image -->
                <div id="img-profile" class="relative flex items-center justify-end cursor-pointer">
                    <img src="images/RK.png" alt="" class="w-[48px] h-[48px] md:w-[64px] md:h-[64px] object-cover rounded-full">
                    
                    <!-- Profile Dropdown -->
                    <div id="profile" class="hidden absolute right-0 mt-[350px] w-64 bg-[#FFFEF9] border rounded-lg shadow-lg z-50">
                        <div class="flex items-center gap-3 p-4 border-b border-gray-200">
                            <img src="images/custom-mean-profile.png" class="w-12 h-12 rounded-full object-cover">
                            <div class="flex flex-col">
                                <p class="text-md font-semibold">Roshan Khadka</p>
                                <p class="text-sm text-gray-500">+977 9863748652</p>
                            </div>
                        </div>
                        <div class="flex flex-col p-4 space-y-3">
                            <a href="#" class="flex items-center gap-3 hover:bg-gray-100 rounded-md p-2">
                                <img src="images/UserCircle.svg" class="w-6 h-6">
                                <span class="text-md">My Profile</span>
                            </a>
                            <a href="#" class="flex items-center gap-3 hover:bg-gray-100 rounded-md p-2">
                                <img src="images/BellRinging.svg" class="w-6 h-6">
                                <span class="text-md">Notification</span>
                            </a>
                            <a href="#" class="flex items-center gap-3 hover:bg-gray-100 rounded-md p-2">
                                <img src="images/SignOut.svg" class="w-6 h-6">
                                <span class="text-md">Log Out</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>        
        </div>
    </nav>

    <section class="pt-6 md:pt-12 px-6 md:px-0">
        <div class="max-w-4xl mx-auto">
            <h1 id="heading" class="text-xl md:text-4xl font-semibold">Edit profile</h1>

            <div class="mt-6 md:mt-12 flex items-center gap-6">
                <div>
                    <img src="images/RK.png" alt="" class="w-[48px] h-[48px] md:w-[72px] md:h-[72px] object-cover rounded-full">
                </div>
                <div class="">
                    <a href="#" class="text-[#d9253c] text-md font-semibold">Change</a>
                </div>
            </div>

            <!-- form -->
            <div class="mt-6 md:mt-12">
                <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Full Name -->
                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1 text-[#8A8A8A]" for="fullname">Full name<span class="text-[#D9253C]">*</span></label>
                        <input type="text" id="fullname" class="bg-[#FFFEF9] border border-[#8A8A8A] rounded px-3 py-3 focus:outline-none focus:ring-1 focus:ring-[#363636]" placeholder="">
                    </div>

                    <!-- Phone Number -->
                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1 text-[#8A8A8A]" for="phone">Phone number<span class="text-[#D9253C]">*</span></label>
                        <input type="text" id="phone" class="bg-[#FFFEF9] border border-[#8A8A8A] rounded px-3 py-3 focus:outline-none focus:ring-1 focus:ring-[#363636]" value="9863781603">
                    </div>

                    <!-- Street Address -->
                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1 text-[#8A8A8A]" for="address">Street address<span class="text-[#D9253C]">*</span></label>
                        <input type="text" id="address" class="bg-[#FFFEF9] border border-[#8A8A8A] rounded px-3 py-3 focus:outline-none focus:ring-1 focus:ring-[#363636]" placeholder="">
                    </div>

                    <!-- City -->
                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1 text-[#8A8A8A]" for="city">Your city<span class="text-[#D9253C]">*</span></label>
                        <select id="city" class="bg-[#FFFEF9] border border-[#8A8A8A] rounded px-3 py-3 focus:outline-none focus:ring-1 focus:ring-[#363636]">
                            <option selected disabled>Select your city</option>
                            <option>Kathmandu</option>
                            <option>Pokhara</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <!-- Plan -->
                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1 text-[#8A8A8A]" for="plan">Plan<span class="text-[#D9253C]">*</span></label>
                        <select id="plan" class="bg-[#FFFEF9] border border-[#8A8A8A] rounded px-3 py-3 focus:outline-none focus:ring-1 focus:ring-[#363636]">
                            <option selected disabled>Select a plan</option>
                            <option>Weekly</option>
                            <option>Monthly</option>
                        </select>
                    </div>

                    <!-- Payment Method -->
                    <div class="flex flex-col">
                        <label class="text-sm font-medium mb-1 text-[#8A8A8A]" for="payment">Payment method<span class="text-[#D9253C]">*</span></label>
                        <select id="payment" class="bg-[#FFFEF9] border border-[#8A8A8A] rounded px-3 py-3 focus:outline-none focus:ring-1 focus:ring-[#363636]">
                            <option selected disabled>Select a payment method</option>
                            <option>Credit Card</option>
                            <option>Mobile Payment</option>
                            <option>Cash on Delivery</option>
                        </select>
                    </div>

                    <!-- Meal Preference (Textarea full width) -->
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-sm font-medium mb-1 text-[#8A8A8A]" for="meal">Meal Preference</label>
                        <textarea id="meal" rows="6" placeholder="Add your preferences here..." class="bg-[#FFFEF9] border border-[#8A8A8A] rounded px-3 py-3 focus:outline-none focus:ring-1 focus:ring-[#363636]"></textarea>
                    </div>
                </form>
            </div>

            <!-- buttons -->
            <div class="flex mt-6 gap-4">
                <div class="px-2 py-3 bg-[#d9253c] rounded">
                    <p class="text-md text-white font-medium">Save Changes</p>
                </div>
                <div class="px-2 py-3 bg-[#363636] rounded">
                    <p class="text-md text-white font-medium">Cancel</p>
                </div>
            </div>
        
        </div>
    </section>

    <!-- md:footer -->
    <section class="hidden md:block mt-16 md:mt-20">
        <div class="bg-[#2B2B2B] ">
            <div class="container mx-auto py-4 px-6 md:px-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                    <p class="text-sm text-white tracking-wide">© 2025 Office Khaja. All rights reserved</p>
                <!-- Social -->
                <div class="hidden md:flex md:ml-10">
                    <div class="flex text-white space-x-4 text-xl">
                        <a href="#" class=""><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class=""><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fa-brands fa-youtube text-[#FFFFFF] cursor-pointer"></i></a>
                    </div>
                </div>
            </div>
        </div> 
    </section>
</body>
</html>
