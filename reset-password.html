<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

</head>
<body>
    <!-- NAV BAR -->
    <nav class="bg-[#D9253C] top-0 h-[52px] md:h-[96px]">
        <div class="container mx-auto flex items-center justify-between px-4">
            <div class="flex items-center">
                <img src="images/Office Khaja Logo White.svg" alt="officekhaja logo" class="h-[58px] md:h-[90px] md:w-[90px] w-auto object-contain">
            </div>  

            <div class="ml-16">
                <a href="./index.html" class="text-white text-sm md:text-base font-semibold">Go to Home</a>
            <div>
        </div>
    </nav>

    <section class="bg-[#d9253c] pt-80">
        <div class="relative text-white">
            <img src="images/Footer-Arc.svg" alt="" class="w-full h-[400px] object-cover object-top">

            <!-- Overlay Content -->
            <div class="hidden md:flex absolute bottom-0 left-0 w-full py-4 px-6 md:px-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                <p class="text-sm text-white">© 2025 Office Khaja. All Rights Reserved</p>

                <!-- Social -->
                <div class="md:ml-10">
                    <div class="flex text-white space-x-4 text-sm tracking-wide">
                        <a href="#">Privacy Policy</a>
                        <a href="#">Terms & Conditions</a>
                    </div>
                </div>
            </div>
        </div>


    <!-- CENTER CARD -->
    <div class="absolute inset-0 flex justify-center items-start mt-36 md:mt-48 p-4">

        <div class="bg-white rounded-lg shadow-lg w-[450px] px-4 py-8 md:px-12 md:py-12">

            <h2 class="text-2xl md:text-[28px] font-semibold mb-8">Reset your password</h2>

            <!-- PASSWORD -->
            <label class="text-[#6A6A6A] text-sm mb-1 font-semibold tracking-wide">New password</label>
            <div class="relative mb-3 md:mb-4">
                <input 
                    id="password"
                    type="password"
                    class="w-full border border-[#8A8A8A] px-3 py-3 rounded mt-1 focus:border-[#363636] text-sm"
                >

                <p id="passwordStrengthError" class="hidden text-[#D00416] text-sm mb-3">
                    Password must be at least 8 characters long and include uppercase, lowercase, number, and symbol.
                </p>

                <!-- Eye Icon -->
                <span 
                    id="togglePassword"
                    class="material-symbols-outlined absolute right-4 top-4 cursor-pointer text-[#8A8A8A]"
                >visibility_off</span>
            </div>

            <!-- CONFIRM PASSWORD -->
            <label class="text-[#6A6A6A] text-sm mb-1 font-semibold tracking-wide">Confirm password</label>
            <div class="relative">
                <input 
                    id="confirmPassword"
                    type="password"
                    class="w-full border border-[#8A8A8A] px-3 py-3 rounded mt-1 focus:border-[#363636] text-sm"
                >
                
                <p id="passwordError" class="hidden text-[#D00416] text-sm">
                    Passwords do not match
                </p>

                <!-- Eye Icon -->
                <span 
                    id="toggleConfirmPassword"
                    class="material-symbols-outlined absolute right-4 top-4 cursor-pointer text-[#8A8A8A]"
                >visibility_off</span>
            </div>

            <button id="resetBtn" class="mt-10 w-full bg-[#D9253C] text-white text-base font-medium py-3 rounded">
                Reset Password
            </button>

            <p class="text-sm md:text-sm mt-6 text-[#6A6A6A]">
                <a href="./log-in.html" class="text-[#D9253C] font-semibold">Back to log in</a>
            </p>
        </div>
    </div>
</section>
<script src="script/password-visibility.js"></script>
<!-- <script src="script/create-account.js"></script> -->

<script>
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const btn = document.getElementById("resetBtn");
    const strongPassword = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
    
    btn.addEventListener("click", function (e) {
        if (password.value.trim() === "") {
            passwordStrengthError.textContent = "Password is required";
            passwordStrengthError.classList.remove("hidden");
            password.classList.add("border-[#D00416]");
            valid = false;
        }
        else if (!strongPassword.test(password.value)) {
            passwordStrengthError.textContent = 
                "Password must be 8+ chars with uppercase, lowercase, number & symbol.";
            passwordStrengthError.classList.remove("hidden");
            password.classList.add("border-[#D00416]");
            valid = false;
        }   
        else {
            passwordStrengthError.classList.add("hidden");
            password.classList.remove("border-[#D00416]");
        }
    });

    btn.addEventListener("click", function (e) {
            if (password.value.trim() === ""){
            passwordError.textContet = "Please confirm your password";
            passwordError.classList.remove("hidden");
            confirmPassword.classList.add("border-[#D00416]");
        }
        else if(password.value !== confirmPassword.value){
            passwordError.textContent = "Passwords do not match";
            passwordError.classList.remove("hidden");
            confirmPassword.classList.add("border-[#D00416]");
        }
        else{
            passwordError.classList.add("hidden");
            confirmPassword.classList.remove("border-[#D00416]");
            window.location.href= "./successw"
        }
    });  
</script>

</body>
</html>
