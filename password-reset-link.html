<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

</head>
<body>
    <!-- NAV BAR -->
    <nav class="bg-[#D9253C] top-0 h-[52px] md:h-[96px]">
        <div class="container mx-auto flex items-center justify-between px-4">
            <div class="flex items-center">
                <img src="images/Office Khaja Logo White.svg" alt="officekhaja logo" class="h-[58px] md:h-[90px] md:w-[90px] w-auto object-contain">
            </div>  

            <div class="ml-16">
                <a href="./index.html" class="text-white text-sm md:text-base font-semibold">Go to Home</a>
            <div>
        </div>
    </nav>

    <section class="bg-[#d9253c] pt-80">
        <div class="relative text-white">
            <img src="images/Footer-Arc.svg" alt="" class="w-full h-[400px] object-cover object-top">

            <!-- Overlay Content -->
            <div class="hidden md:flex absolute bottom-0 left-0 w-full py-4 px-6 md:px-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                <p class="text-sm text-white">© 2025 Office Khaja. All Rights Reserved</p>

                <!-- Social -->
                <div class="md:ml-10">
                    <div class="flex text-white space-x-4 text-sm tracking-wide">
                        <a href="#">Privacy Policy</a>
                        <a href="#">Terms & Conditions</a>
                    </div>
                </div>
            </div>
        </div>


    <!-- CENTER CARD -->
    <div class="absolute inset-0 flex justify-center items-start mt-32 md:mt-48 p-4">

        <div class="bg-white rounded-lg shadow-lg w-[450px] px-4 py-8 md:px-12 md:py-12">

            <h2 class="text-2xl md:text-[28px] font-semibold mb-4">Password reset link sent successfully</h2>
            <p class="text-sm text-[#363636] mb-6 tracking-wide leading-relaxed pr-12">We've sent a verification link to <span id="getEmail" class="font-semibold">jesikarai000@gmail.com</span></p>
            <p class="text-sm text-[#363636] mb-6 tracking-wide leading-relaxed">Please check your inbox (and spam folder) and click the link to reset your password.</p>

            <p class="text-base font-semibold mb-2">Didn't receive the link?</p>
            <button class="w-full bg-[#D9253C] text-white text-base font-medium py-3 rounded">
                Resend Link
            </button>
        </div>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const getEmail = document.getElementById("getEmail");
    const email = localStorage.getItem("setEmail");

    if (email) {
        getEmail.textContent = email;
    } else {
        // Fallback if no email is found
        getEmail.textContent ="not found";
    }
});
</script>

<script src="script/password-visibility.js"></script>
<script src="script/create-account.js"></script>
</body>
</html>
