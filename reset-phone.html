<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

</head>
<body>
    <!-- NAV BAR -->
    <nav class="bg-[#D9253C] top-0 h-[52px] md:h-[96px]">
        <div class="container mx-auto flex items-center justify-between px-4">
            <div class="flex items-center">
                <img src="images/Office Khaja Logo White.svg" alt="officekhaja logo" class="h-[58px] md:h-[90px] md:w-[90px] w-auto object-contain">
            </div>  

            <div class="ml-16">
                <a href="./index.html" class="text-white text-sm md:text-base font-semibold">Go to Home</a>
            <div>
        </div>
    </nav>

    <section class="bg-[#d9253c] pt-80">
        <div class="relative text-white">
            <img src="images/Footer-Arc.svg" alt="" class="w-full h-[400px] object-cover object-top">

            <!-- Overlay Content -->
            <div class="hidden md:flex absolute bottom-0 left-0 w-full py-4 px-6 md:px-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                <p class="text-sm text-white">© 2025 Office Khaja. All Rights Reserved</p>

                <!-- Social -->
                <div class="md:ml-10">
                    <div class="flex text-white space-x-4 text-sm tracking-wide">
                        <a href="#">Privacy Policy</a>
                        <a href="#">Terms & Conditions</a>
                    </div>
                </div>
            </div>
        </div>


    <!-- CENTER CARD -->
    <div class="absolute inset-0 flex justify-center items-start mt-36 md:mt-48 p-4">

        <div class="bg-white rounded-lg shadow-lg w-[450px] px-4 py-8 md:px-12 md:py-12">

            <h2 class="text-2xl md:text-[28px] font-semibold mb-4">Reset your password</h2>
            <p class="text-xs text-[#363636] mb-8 tracking-wide leading-relaxed">Enter the email address associated with your account and we'll send you a link to reset your password.</p>

            <!-- Phone -->
            <label class="text-[#6A6A6A] text-sm mb-1 font-semibold tracking-wide">Phone number</label>
            <input type="text" id="phone-number" class="w-full border border-[#8A8A8A] px-2 py-3 rounded mb-3 md:mb-2 mt-1 focus:border-[#363636] text-sm">
            <p id="phoneError" class="hidden text-[#D00416] text-sm mb-4 font-awesome">Phone number error</p>

            <button id="continueBtn" class="w-full bg-[#D9253C] text-white text-base font-medium py-3 rounded mt-4">
                Continue
            </button>

            <p class="text-sm md:text-sm mt-6 text-[#6A6A6A]">
                <a href="#" class="font-semibold">Back to log in</a>
            </p>
        </div>
    </div>
</section>


<script>
const phone = document.getElementById("phone-number");
const phoneError = document.getElementById("phoneError");
const btn = document.getElementById("continueBtn");

// Allow only digits
phone.addEventListener("input", () => {
    phone.value = phone.value.replace(/\D/g, "");
});

// Validate on click
btn.addEventListener("click", (e) => {
    e.preventDefault();
    if (!phone.value) {
        phoneError.textContent = "Phone number is required";
        phoneError.classList.remove("hidden");
        phone.classList.add("border-[#D00416]");
    } else if (phone.value.length !== 10) {
        phoneError.textContent = "Phone number must be exactly 10 digits";
        phoneError.classList.remove("hidden");
        phone.classList.add("border-[#D00416]");
    } else {
        phoneError.classList.add("hidden");
        phone.classList.remove("border-[#D00416]");
        console.log("Phone valid:", phone.value);
        window.location.href = "./verify-phone-number.html";
    }
});
</script>
</body>
</html>
